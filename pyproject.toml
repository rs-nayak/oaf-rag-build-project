[project]
name = "oaf-rag"
version = "0.1.0"
description = "OAF Build Fellowship — Retrieval-Augmented Generation system, built from scratch over 8 weeks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mayank Gowda" }]

dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # LLM + embeddings (default)
    "google-genai>=0.3",
    # Vector DB
    "chromadb>=0.5",
    # Document loading
    "pypdf>=4.2",
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # HTTP (for Ollama)
    "httpx>=0.27",
]

[project.optional-dependencies]
# Local fallback: SentenceTransformers (heavy: pulls torch). Opt-in.
local = ["sentence-transformers>=2.7"]

# Other LLM providers (Workshop 7 stretch).
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]

# Dev tooling.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

# ----- Ruff -----
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # FastAPI Depends() etc. need function calls in defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----- Pytest -----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit external services",
]
